name: CI

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore OficinaMecanica.Seguranca.sln

      - name: Build
        run: dotnet build OficinaMecanica.Seguranca.sln --no-restore --configuration Release

      # A cobertura sai em OpenCover (coverlet.collector) porque e o formato que o SonarCloud importa. Os testes de
      # Integration ficam fora do CI: sobem um host real do Azure Functions com Azurite (ver FunctionHostFixture).
      - name: Test - Domain
        run: dotnet test tests/OficinaMecanica.Seguranca.Domain.Tests --no-build --no-restore --configuration Release --logger "trx;LogFileName=domain-tests.trx" --results-directory TestResults --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Test - Application
        run: dotnet test tests/OficinaMecanica.Seguranca.Application.Tests --no-build --no-restore --configuration Release --logger "trx;LogFileName=application-tests.trx" --results-directory TestResults --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Test - Infrastructure
        run: dotnet test tests/OficinaMecanica.Seguranca.Infrastructure.Tests --no-build --no-restore --configuration Release --logger "trx;LogFileName=infrastructure-tests.trx" --results-directory TestResults --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Test - Functions
        run: dotnet test tests/OficinaMecanica.Seguranca.Functions.Tests --no-build --no-restore --configuration Release --logger "trx;LogFileName=functions-tests.trx" --results-directory TestResults --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Publish test results
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        if: always()
        with:
          name: Resultados dos Testes
          path: "TestResults/*.trx"
          reporter: dotnet-trx

      - name: Upload test result artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results
          path: TestResults/

      # O job quality importa estes arquivos no SonarCloud em vez de rodar os testes de novo.
      - name: Publicar OpenCover para o Quality
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cobertura-opencover
          path: TestResults/**/coverage.opencover.xml
          retention-days: 7
          if-no-files-found: error

  quality:
    name: "Quality"
    needs: build-and-test
    # PR vindo de fork nao recebe secrets (SONAR_TOKEN chega vazio), entao a analise nao tem como rodar. Pular e o
    # comportamento esperado: um check obrigatorio pulado conta como satisfeito, e o PR de fork continua passando pelo
    # "Build & Test" e por revisao.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # O SonarCloud nao suporta OIDC; o token fica como secret do repositorio e so os steps abaixo o recebem.
      SONAR_SCANNER_VERSION: 12.1.0
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      # Optei por falhar cedo e com mensagem clara: sem este step, a ausencia do token apareceria como um erro obscuro
      # do scanner ou, pior, o job passaria sem analisar nada.
      - name: Verificar configuracao do SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          faltando=""
          [ -n "$SONAR_TOKEN" ] || faltando="$faltando secret:SONAR_TOKEN"
          [ -n "$SONAR_PROJECT_KEY" ] || faltando="$faltando variavel:SONAR_PROJECT_KEY"
          [ -n "$SONAR_ORGANIZATION" ] || faltando="$faltando variavel:SONAR_ORGANIZATION"
          if [ -n "$faltando" ]; then
            echo "::error title=SonarCloud nao configurado::Falta configurar no repositorio (Settings > Secrets and variables > Actions):$faltando."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # O SonarCloud precisa do historico completo para atribuir o codigo novo (blame) e calcular o Quality Gate.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      # O scanner e Java por baixo.
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache pacotes do SonarCloud
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Instalar o scanner do SonarCloud
        run: dotnet tool install --global dotnet-sonarscanner --version "$SONAR_SCANNER_VERSION"

      # A cobertura vem do job build-and-test (mesmo commit, mesmo caminho de workspace, entao os caminhos de arquivo
      # dentro do OpenCover continuam validos aqui).
      - name: Baixar o OpenCover do build-and-test
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cobertura-opencover
          path: TestResults

      # O scanner instrumenta a compilacao: begin -> build -> end. O build precisa ser completo (--no-incremental)
      # e acontece neste job porque o do build-and-test nao passou pelo scanner.
      # Fora da cobertura ficam as Migrations, o Program.cs, o DependencyInjection* e as EF Configurations, que sao
      # montagem e codigo gerado; as Migrations tambem saem da analise de codigo.
      # sonar.qualitygate.wait=true faz o "end" esperar o Quality Gate e FALHAR o job se ele reprovar.
      - name: Analise SonarCloud (begin, build, end)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet-sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs,**/DependencyInjection*.cs,**/Data/Configurations/**" \
            /d:sonar.exclusions="**/Migrations/**" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300
          dotnet build OficinaMecanica.Seguranca.sln --configuration Release --no-incremental
          dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  deploy:
    # Mesma Function App recebe deploy tanto de main quanto de release - o
    # cluster/plano nao tem recurso pra manter uma segunda instancia (ver
    # secao "Ambiente de Homologacao" no README). A separacao aqui e so de
    # processo (branch protegida + PR obrigatorio), nao de infraestrutura.
    name: Deploy to Azure Function App
    runs-on: ubuntu-latest
    needs: [build-and-test, quality]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release')
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Publish do projeto Functions
        run: dotnet publish src/OficinaMecanica.Seguranca.Functions --configuration Release --output ./publish

      - name: Azure Login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Database.Migrate() em Program.cs so roda quando
      # AZURE_FUNCTIONS_ENVIRONMENT=Development (nunca em producao real) -
      # esse step aplica as migrations pendentes de verdade.
      - name: Aplicar migrations
        run: |
          dotnet tool install --global dotnet-ef --version 8.*
          export ConnectionStrings__DefaultConnection=$(az keyvault secret show --vault-name kvfiap --name seguranca-sql-connection-string --query value -o tsv)
          dotnet ef database update --project src/OficinaMecanica.Seguranca.Infrastructure --startup-project src/OficinaMecanica.Seguranca.Functions

      # Sem publish-profile de proposito - a Azure/functions-action, quando esse
      # input nao e passado, usa o contexto ja autenticado do passo acima (OIDC,
      # sem secret de longa duracao), igual ao az acr login/az aks get-credentials
      # do CI do OficinaMecanica. O Service Principal so tem "Contributor" na
      # propria Function App (OficinaMecanica.Infra/github_oidc_seguranca/main.tf).
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: funcsegurancafiap
          package: ./publish
