name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore OficinaMecanica.Seguranca.sln

      - name: Build
        run: dotnet build OficinaMecanica.Seguranca.sln --no-restore --configuration Release

      - name: Test - Domain
        run: dotnet test tests/OficinaMecanica.Seguranca.Domain.Tests --no-build --no-restore --configuration Release --logger "trx;LogFileName=domain-tests.trx" --results-directory TestResults

      - name: Test - Application
        run: dotnet test tests/OficinaMecanica.Seguranca.Application.Tests --no-build --no-restore --configuration Release --logger "trx;LogFileName=application-tests.trx" --results-directory TestResults

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Resultados dos Testes
          path: "TestResults/*.trx"
          reporter: dotnet-trx

      - name: Upload test result artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/

  deploy:
    name: Deploy to Azure Function App
    runs-on: ubuntu-latest
    needs: build-and-test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Publish do projeto Functions
        run: dotnet publish src/OficinaMecanica.Seguranca.Functions --configuration Release --output ./publish

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Sem publish-profile de proposito - a Azure/functions-action, quando esse
      # input nao e passado, usa o contexto ja autenticado do passo acima (OIDC,
      # sem secret de longa duracao), igual ao az acr login/az aks get-credentials
      # do CI do OficinaMecanica. O Service Principal so tem "Contributor" na
      # propria Function App (OficinaMecanica.Infra/github_oidc_seguranca/main.tf).
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: funcsegurancafiap
          package: ./publish
